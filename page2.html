<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-image: url('https://i.pinimg.com/1200x/5e/b2/15/5eb215885f625213624834267b067a33.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        nav {
            width: 100%;
            background-color: antiquewhite;
            border-bottom: 2px solid #537748;
            padding: 15px 30px;
            display: flex;
            justify-content: center;
        }

        .nav-container {
            display: flex;
            gap: 20px;
            cursor: pointer;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            background-color: rgba(255, 255, 255, 0.92);
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-top: 0;
        }

        h3,
        h4 {
            color: #444;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            margin-bottom: 8px;
            cursor: pointer;
        }

        input[type="checkbox"],
        input[type="radio"] {
            margin-right: 8px;
            transform: scale(1.1);
            cursor: pointer;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #608f5a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #537748;
        }

        #output1 {
            margin-top: 15px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #ffffff;
            font-size: 15px;
            line-height: 1.5;
        }

        .active-tab {
            display: block;
        }
        #category{
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            color: #333;
        }
    </style>
</head>

<body>
    <nav>
        <link rel="stylesheet" href="style.css">
        <ul>
            <li><a href="index.html"><b>Main</b></a></li>
            <li><a href="page2.html"><b>SKU Generator</b></a></li>
        </ul>
    </nav>
    <div id="food-container" class="active-tab">
        <center>
            <img src="ExtraVirginResto.png" id="logo" alt="Logo">
        </center>

        <div class="container" id="skugen">
            <h1>SKU Generator</h1>
            <hr>
            <h3>Category</h3>
            <select name="Category" id="category">
                <option value="0">Select Category</option>
                <option value="Appetizer">Appetizer</option>
                <option value="Entree">Entree</option>
                <option value="Extras">Extras</option>
                <option value="Drinks">Drinks</option>
            </select>
            <br>

            <h3>Product Name</h3>
            <input type="text" id="productname" name="productname" placeholder="Ex: Olive Roasted Chicken" required>
            <br>
            <h3>Stock Quantity</h3>
            <input type="text" id="stock_qty" name="stock_qty" placeholder="Ex: 35" required>
            <br>

            <button type="button" py-click="show_SKU">Generate SKU</button>

            <h3>-- FINAL SKU: --</h3>
            <div id="output1" class="tab-section">
            </div>

            <script type="py" src="main.py"></script>

        </div>
    </div>

</body>

</html>
