<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
     <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />

     <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px 20px;
        background-image: url('https://i.pinimg.com/736x/a6/47/26/a64726341909a435f90143608f20b7d3.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
    }
      .container {
        max-width: 500px;
        margin: 0 auto;
        background-color: rgba(255, 255, 255, 0.92);
        padding: 25px 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    h1 {
        color: #333;
        text-align: center;
        margin-top: 0;
    }

    h3, h4 {
        color: #444;
        margin-top: 20px;
        margin-bottom: 10px;
    }

    label {
        display: inline-block;
        margin-bottom: 8px;
        cursor: pointer;
    }

    input[type="checkbox"],
    input[type="radio"] {
        margin-right: 8px;
        transform: scale(1.1);
        cursor: pointer;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 12px 20px;
        background-color: #608f5a;
        color: white;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background-color: #537748;
    }

    #output1 {
        margin-top: 15px;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background-color: #ffffff;
        font-size: 15px;
        line-height: 1.5;
    }
    </style>


 </head>
<body>

    <div class="container">
        <h1>Extra Virgin Resto</h1>
        <hr>

        <h3>Food Menu</h3>
        <input type="checkbox" id="prod1" value="180">
        <label for="prod1"> Olive Roasted Chicken(₱180)</label><br>

        <input type="checkbox" id="prod2" value="100">
        <label for="prod2"> Green Olive Pasta(₱100)</label><br>

        <input type="checkbox" id="prod3" value="150">
        <label for="prod3"> Olive Tapenade (₱150)</label><br>

        <input type="checkbox" id="prod4" value="170">
        <label for="prod4"> Olive Garden Salad (₱170)</label><br>

        <input type="checkbox" id="prod5" value="129">
        <label for="prod5"> Olive Wreath Platter (₱129)</label><br>

        <h3>Select Size</h3>
        <input type="radio" id="regular" name="size" value="0" checked>
        <label for="regular">Regular (+₱0)</label><br>

        <input type="radio" id="large" name="size" value="30">
        <label for="large">UpSize (+₱30)</label><br>

        <h4>Add-Ons</h4>
        <input type="checkbox" id="addon1" value="90">
        <label for="addon1">Extra Olive Oil (+₱90)</label><br>

        <input type="checkbox" id="addon2" value="70">
        <label for="addon2">Extra Olives (+₱70)</label><br>

        <input type="checkbox" id="addon3" value="70">
        <label for="addon3">Extra Cheese (+₱70)</label><br>

         <h3>Bar Menu</h3>
        <input type="checkbox" id="bar1" value="250">
        <label for="bar1"> Dirty Martini (₱250)</label><br>

        <input type="checkbox" id="bar2" value="270">
        <label for="bar2">Mojito(₱270)</label><br>

        <input type="checkbox" id="bar3" value="150">
        <label for="bar3">Sparkling Olives (₱150)</label><br>

          <h3>Select Size</h3>
        <input type="radio" id="regular" name="size" value="0" checked>
        <label for="regular">Regular (+₱0)</label><br>

        <button type="button" py-click="create_order">Create Order</button>

        <h3>-- Receipt --</h3>
        <div id="output1"></div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
    
    
</body>
</html>
